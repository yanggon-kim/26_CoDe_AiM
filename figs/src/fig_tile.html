     multiplier lanes (cells with an ellipsis, 32 lanes = Table II, mobile) and adder tree; the beat sequencer as a
     control bar under the datapath, clocked at CK = D / t_col (2). Right group (bracket "row reuse"): the staging
     register (V slots) fed by GB words from the shared global buffer (full-height block beside the bank, V tokens x K

     drain. Tint = what CoDe adds or sizes by V. Text >= 8 pt (caption size).
     Drawn at final size (252 x 173 pt; \columnwidth = 252 pt), 1 user unit = 1 pt. Build:
     python3 scripts/html2pdf.py fig_tile  ->  figs/fig_tile.pdf (+ .png preview).
