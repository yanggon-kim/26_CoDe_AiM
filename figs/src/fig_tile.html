<!-- Fig. (IV-D): the CoDe PU inside its bank, as a block diagram (skill F9, F10), hand-maintained. Left group (bracket
     "beat filling"): the bank's cell array over the IOSA, whose column bus drops into the weight latch (1); the stock
     multiplier lanes (cells with an ellipsis, 32 lanes = Table II, mobile) and adder tree; the beat sequencer as a
     control bar under the datapath, clocked at CK = D / t_col (2). Right group (bracket "row reuse"): the staging
     buffer, on the mobile platform a three-entry queue of 512-bit GB words, two tokens' slices each, fed by GB words from the shared global buffer (full-height block beside the bank, V tokens x K
     chunk), the accumulator file (2V scalar slots in two sets of V, drawn as one narrow column: a vector, not a matrix) and the drain port (5). Circled 1-5 = the IV-D walk-through:
     (1) latch the column, (2) step k, (3) lanes multiply by token k's slice from the staging buffer, (4) add into accumulator slot k, (5) burst
     drain. Tint = what CoDe adds or sizes by V. Text >= 8 pt (caption size).
     Drawn at final size (240 x 140 pt, 0.8 of the former 173 pt, user 2026-11-15; ACM sigconf \columnwidth = 240 pt; the GB-word gap cut by 12 pt from the IEEE 252 pt), 1 user unit = 1 pt. Build:
     python3 scripts/html2pdf.py fig_tile  ->  figs/fig_tile.pdf (+ .png preview).
     Colours (skill F1/F2): existing hardware white / grays; CoDe's additions #CFE2F3 fill, #2B5FA8 stroke; red
     #E03127 only for the circled step marks. -->
