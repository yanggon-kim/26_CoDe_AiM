<!-- Fig. 1 (II-B, cited again in III-B): (a) AiM-style PIM on one LPDDR5 channel, one bank enlarged; (b) command timing on the mobile platform: reads to two bank groups t_CCD_S apart, then all-bank MAC commands t_CCD_L apart. Two PU lanes: the stock PU (column-matched, 200 MHz, one beat = t_CCD_L; Table I) and a PU clocked at CK (0.8 GHz, the faster PU of III-B; one beat = 1 CK, then idle). Nothing here is CoDe's, so there is no tint. Values: CK 0.8 GHz (CoDe f_PU on LPDDR5-6400, Table I); t_CCD_L = t_col = 5 ns (III-D); t_CCD_S = t_CCD_L / 2 (II-B). Panel (b) was cut in the 2026-10-18 trim (R4) and restored by the user's decision the same day.
     Panel (c) (2026-10-19, useful-MAC model of II-B / III-B): one row sweep on the C/A bus, not to scale, broken inside the MAC16 stream: WRGB x A, WRMAC16, TMOD, PREA, ACT16, MAC16 x c, TMOD, RDMAC16 x A; fills: row-switch commands (t_row) #BFBFBF, token load/drain commands (t_tok) white, MAC16 slots #E8E8E8 as the MAC command of (b); (b) is the zoomed-in slot (U_MAC), (c) the row sweep (f_MAC). Block widths from Liberation Serif metrics at 6 pt.
     Drawn at final size (252 x 303.0 pt; \columnwidth = 252 pt), 1 user unit = 1 pt. Build:
     python3 scripts/html2pdf.py fig_dram_pim  ->  figs/fig_dram_pim.pdf (+ .png preview).
